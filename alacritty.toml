[window]

decorations = "Full"
padding.x = 16
padding.y = 16

[font]

size = 12
offset.x = 2
offset.y = 2

normal.family = "Cartograph CF"

bold.family = "Cartograph CF"

italic.family = "Cartograph CF"

bold_italic.family = "Cartograph CF"

[cursor]

style.blinking = "Never"

